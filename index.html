<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiệp Cưới - Nguyễn Văn Trường & Nông Thu Huyền (Nhà Trai)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: {
                            DEFAULT: '#7a0000',
                            dark: '#5c0000',
                            light: '#9e1a1a',
                            subtle: '#f9e6e6'
                        },
                        cream: {
                            DEFAULT: '#faf6f0',
                            dark: '#f5f0eb',
                            card: '#fffefb'
                        },
                        gold: {
                            DEFAULT: '#d4af37',
                            light: '#f3e5ab',
                            dark: '#aa8c2c'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #faf6f0;
            color: #2c2c2c;
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Cormorant Garamond', serif;
        }
        ::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #faf6f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #7a0000;
            border-radius: 4px;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) translateX(50px) rotate(360deg); opacity: 0.2; }
        }
        .petal {
            position: fixed;
            top: -10vh;
            z-index: 40;
            pointer-events: none;
            animation: fall linear infinite;
        }
        .glass-card {
            background: rgba(255, 254, 251, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .pulse-gold {
            box-shadow: 0 0 0 0 rgba(122, 0, 0, 0.4);
            animation: pulseBurgundy 2s infinite;
        }
        @keyframes pulseBurgundy {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(122, 0, 0, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(122, 0, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(122, 0, 0, 0); }
        }
        .gallery-container {
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .gallery-item {
            scroll-snap-align: center;
            transition: all 0.4s ease;
            transform: scale(0.88);
            opacity: 0.6;
            filter: grayscale(30%);
        }
        .gallery-item.active {
            transform: scale(1.05);
            opacity: 1;
            filter: grayscale(0%);
            box-shadow: 0 20px 25px -5px rgba(122, 0, 0, 0.3), 0 10px 10px -5px rgba(212, 175, 55, 0.2);
            border: 2px solid #d4af37;
        }
    </style>
</head>
<body>
    <!-- WELCOME MODAL -->
    <div id="welcome-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-burgundy/95 transition-opacity duration-1000 px-4">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#d4af37_1px,transparent_1px)] [background-size:24px_24px]"></div>
        <div class="glass-card max-w-lg w-full p-8 md:p-12 rounded-3xl text-center shadow-2xl relative border-2 border-gold/40 transform transition-all animate-[fadeIn_1s_ease-in-out]">
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2 w-20 h-20 bg-burgundy rounded-full flex items-center justify-center border-4 border-gold shadow-lg">
                <i class="fa-solid fa-ring text-gold text-3xl"></i>
            </div>
            
            <p class="text-gold font-semibold tracking-widest uppercase text-xs mt-4 mb-2">THIỆP CƯỚI ONLINE - NHÀ TRAI</p>
            <h1 class="font-serif text-2xl sm:text-3xl md:text-4xl font-bold text-burgundy mb-3 whitespace-nowrap overflow-hidden text-ellipsis">
                Văn Trường <span class="text-gold font-normal">&</span> Thu Huyền
            </h1>
            <p class="text-gray-600 font-serif italic text-lg mb-6">"Save the Date - 25.10.2026"</p>
            
            <div class="w-24 h-0.5 bg-gold mx-auto mb-6"></div>
            
            <p class="text-gray-700 text-sm md:text-base mb-8 leading-relaxed">
                Trân trọng kính mời bạn và người thương đến dự lễ thành hôn và chung vui cùng gia đình chúng tôi!
            </p>

            <button onclick="openInvitation()" class="w-full py-4 bg-burgundy hover:bg-burgundy-light text-white font-semibold rounded-2xl shadow-xl transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-center space-x-3 text-lg border border-gold/50 pulse-gold">
                <i class="fa-solid fa-envelope-open-text text-gold"></i>
                <span>MỞ THIỆP MỜI</span>
            </button>
        </div>
    </div>

    <audio id="wedding-audio" loop preload="auto">
        <source src="https://audio.jukehost.co.uk/q1mYd0d6l6rB8g0Z1s8x8f7s6d5f4g3h" type="audio/mpeg">
        <source src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" type="audio/ogg">
    </audio>

    <div id="music-control" class="fixed bottom-6 right-6 z-40 hidden items-center space-x-2 bg-burgundy/90 text-white px-4 py-2.5 rounded-full shadow-2xl border border-gold/50 backdrop-blur-md cursor-pointer transition-all hover:bg-burgundy" onclick="toggleMusic()">
        <div class="relative w-7 h-7 flex items-center justify-center">
            <div id="vinyl-icon" class="w-7 h-7 rounded-full bg-gold flex items-center justify-center animate-spin">
                <i class="fa-solid fa-compact-disc text-burgundy text-xs"></i>
            </div>
        </div>
        <span id="music-status-text" class="text-xs font-medium tracking-wide">I Do - Đức Phúc</span>
        <i id="music-icon" class="fa-solid fa-volume-high text-gold ml-1"></i>
    </div>

    <div id="petals-container"></div>

    <header class="fixed top-0 left-0 w-full z-30 bg-cream/90 backdrop-blur-md border-b border-gold/20 transition-all duration-300" id="navbar">
        <div class="max-w-6xl mx-auto px-4
